<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

      .hero-title {
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 50px;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .hero-sub {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        font-size: 15.5px;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .font-mono {
        font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: -0.1px;
      }

      /* ================= ADVANCED BACKGROUND ANIMATIONS ================= */

      /* 1. Volumetric Plasma Waves */
      @keyframes plasmaWave1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
        33% { transform: translate(140px, 35px) scale(1.22); opacity: 0.7; }
        66% { transform: translate(60px, -25px) scale(0.92); opacity: 0.35; }
      }
      @keyframes plasmaWave2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(-160px, -35px) scale(1.3); opacity: 0.6; }
      }
      @keyframes plasmaWave3 {
        0%, 100% { transform: scale(0.95); opacity: 0.25; }
        50% { transform: scale(1.35) translate(40px, 20px); opacity: 0.5; }
      }
      .plasma-1 { animation: plasmaWave1 11s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .plasma-2 { animation: plasmaWave2 13s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .plasma-3 { animation: plasmaWave3 9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      /* 2. Holographic Scanline Sweep */
      @keyframes scanSweep {
        0% { transform: translateX(-240px); opacity: 0; }
        20% { opacity: 0.85; }
        80% { opacity: 0.85; }
        100% { transform: translateX(1160px); opacity: 0; }
      }
      .scan-beam {
        animation: scanSweep 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* 3. Dual Laser Perimeter Beams */
      @keyframes laserTravel1 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 2400; }
      }
      @keyframes laserTravel2 {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 3600; }
      }
      .laser-beam-1 {
        stroke-dasharray: 260 940;
        animation: laserTravel1 9s linear infinite;
      }
      .laser-beam-2 {
        stroke-dasharray: 260 940;
        animation: laserTravel2 9s linear infinite;
      }

      /* 4. Quantum Background Grid Floating Nodes */
      @keyframes quantumNodePulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-8px) scale(1.4); opacity: 0.85; }
      }
      .q-node-1 { animation: quantumNodePulse 4.2s ease-in-out infinite; }
      .q-node-2 { animation: quantumNodePulse 5.1s ease-in-out infinite 1.6s; }
      .q-node-3 { animation: quantumNodePulse 3.8s ease-in-out infinite 0.9s; }

      /* ================= ADVANCED REACT REACTOR ANIMATIONS ================= */

      /* React Core Breathing Pulse */
      @keyframes reactCorePulse {
        0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 8px #61DAFB); }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 20px #22D3EE); }
      }
      .react-nucleus {
        animation: reactCorePulse 3s ease-in-out infinite;
        transform-origin: 750px 140px;
      }

      /* 3D React Elliptical Orbit Rotations */
      @keyframes reactOrbitAlpha {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes reactOrbitBeta {
        0% { transform: rotate(60deg); }
        100% { transform: rotate(420deg); }
      }
      @keyframes reactOrbitGamma {
        0% { transform: rotate(120deg); }
        100% { transform: rotate(480deg); }
      }
      .react-orbit-0 { animation: reactOrbitAlpha 14s linear infinite; transform-origin: 750px 140px; }
      .react-orbit-60 { animation: reactOrbitBeta 16s linear infinite reverse; transform-origin: 750px 140px; }
      .react-orbit-120 { animation: reactOrbitGamma 18s linear infinite; transform-origin: 750px 140px; }

      /* Outer Calibration Ring Spin */
      @keyframes radarCalibrate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-ring {
        animation: radarCalibrate 32s linear infinite;
        transform-origin: 750px 140px;
      }

      /* Mini React Atom in Pill */
      @keyframes miniReactSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .mini-react-atom {
        animation: miniReactSpin 8s linear infinite;
        transform-origin: 15px 15px;
      }

      /* Diamond Sparkle Pulse */
      @keyframes diamondGlow {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.85; filter: drop-shadow(0 0 3px #818CF8); }
        50% { transform: scale(1.25) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 8px #67E8F9); }
      }
      .sparkle-icon {
        animation: diamondGlow 3.6s ease-in-out infinite;
        transform-origin: 8px 8px;
      }

      /* Twinkle Starpoints */
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.85; transform: scale(1.25); }
      }
      .star-a { animation: starPulse 3.2s ease-in-out infinite; transform-origin: center; }
      .star-b { animation: starPulse 4.2s ease-in-out infinite 1.8s; transform-origin: center; }
    </style>

    <!-- Deep Luxury Obsidian Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="50%" stop-color="#0C0E16"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <!-- Scanning Holographic Light Sweep Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="45%" stop-color="#67E8F9" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <!-- Platinum Chrome Metallic Shimmer for Name -->
    <linearGradient id="name-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="42%" stop-color="#C7D2FE"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="58%" stop-color="#F472B6"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-100%; 100%; -100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%; 200%; 0%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- React Neon Glowing Gradients -->
    <linearGradient id="react-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="react-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="react-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Diamond Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Dual Laser Gradients -->
    <linearGradient id="laser-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laser-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Fine Matrix Grid -->
    <pattern id="matrix-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.022)" stroke-width="1"/>
      <circle cx="0" cy="0" r="0.8" fill="rgba(255, 255, 255, 0.06)"/>
    </pattern>

    <!-- Blurs & Filters -->
    <filter id="plasma-blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>
    <filter id="plasma-blur-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="react-glow-filter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="text-backlight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#818CF8" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- ================= BASE CANVAS ================= -->
  <rect x="1" y="1" width="918" height="278" rx="22" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="918" height="278" rx="22" fill="url(#matrix-grid)"/>

  <!-- ================= AMBIENT PLASMA MESH ================= -->
  <g class="plasma-1">
    <circle cx="180" cy="75" r="125" fill="#6366F1" filter="url(#plasma-blur-lg)"/>
  </g>
  <g class="plasma-2">
    <circle cx="480" cy="180" r="115" fill="#06B6D4" filter="url(#plasma-blur-md)"/>
  </g>
  <g class="plasma-3">
    <circle cx="750" cy="140" r="140" fill="#61DAFB" opacity="0.4" filter="url(#plasma-blur-lg)"/>
  </g>

  <!-- ================= HOLOGRAPHIC SCANLINE BEAM ================= -->
  <rect class="scan-beam" y="2" width="160" height="276" fill="url(#scan-grad)"/>

  <!-- ================= QUANTUM FLOATING GRID NODES ================= -->
  <g class="q-node-1" transform="translate(360, 90)">
    <circle cx="0" cy="0" r="2.5" fill="#67E8F9"/>
    <circle cx="0" cy="0" r="6" stroke="rgba(103, 232, 249, 0.3)" stroke-width="1"/>
  </g>
  <g class="q-node-2" transform="translate(520, 160)">
    <circle cx="0" cy="0" r="2" fill="#818CF8"/>
    <circle cx="0" cy="0" r="5" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
  </g>
  <g class="q-node-3" transform="translate(240, 190)">
    <circle cx="0" cy="0" r="2" fill="#F472B6"/>
  </g>

  <!-- ================= CYBER HUD CORNER ACCENTS ================= -->
  <!-- Top Left HUD Bracket -->
  <g transform="translate(24, 20)" opacity="0.4">
    <path d="M 0 16 L 0 0 L 16 0" stroke="#67E8F9" stroke-width="1.4" fill="none"/>
    <circle cx="0" cy="0" r="1.5" fill="#67E8F9"/>
  </g>
  <!-- Bottom Left Technical Tick -->
  <g transform="translate(24, 256)" opacity="0.35">
    <path d="M 0 -14 L 0 0 L 14 0" stroke="#818CF8" stroke-width="1.4" fill="none"/>
    <line x1="20" y1="0" x2="35" y2="0" stroke="#818CF8" stroke-width="1"/>
  </g>
  <!-- Bottom Right HUD Data Bracket -->
  <g transform="translate(896, 256)" opacity="0.35">
    <path d="M 0 -14 L 0 0 L -14 0" stroke="#67E8F9" stroke-width="1.4" fill="none"/>
  </g>

  <!-- Static Outer Rim -->
  <rect x="1" y="1" width="918" height="278" rx="22" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" fill="none"/>

  <!-- Dual Chasing Laser Border Beams -->
  <rect class="laser-beam-1" x="1" y="1" width="918" height="278" rx="22" stroke="url(#laser-1)" stroke-width="2" fill="none"/>
  <rect class="laser-beam-2" x="1" y="1" width="918" height="278" rx="22" stroke="url(#laser-2)" stroke-width="2" fill="none"/>

  <!-- ================= 3D KINETIC REACT QUANTUM ENGINE (Right Side) ================= -->
  <g transform="translate(0, 0)">
    <!-- Ambient Core React Glow Aura -->
    <circle cx="750" cy="140" r="55" fill="#61DAFB" opacity="0.3" filter="url(#react-glow-filter)"/>

    <!-- Rotating Radar Calibration Ring -->
    <g class="radar-ring" opacity="0.3">
      <circle cx="750" cy="140" r="115" stroke="rgba(97, 218, 251, 0.25)" stroke-width="1" stroke-dasharray="3 7" fill="none"/>
      <!-- Cardinal Calibration Ticks -->
      <line x1="750" y1="21" x2="750" y2="29" stroke="#61DAFB" stroke-width="1.5"/>
      <line x1="750" y1="251" x2="750" y2="259" stroke="#61DAFB" stroke-width="1.5"/>
      <line x1="631" y1="140" x2="639" y2="140" stroke="#61DAFB" stroke-width="1.5"/>
      <line x1="861" y1="140" x2="869" y2="140" stroke="#61DAFB" stroke-width="1.5"/>
    </g>

    <!-- React Electron Orbit Alpha (0 deg) -->
    <g class="react-orbit-0">
      <ellipse cx="750" cy="140" rx="100" ry="38" stroke="url(#react-cyan-grad)" stroke-width="1.8" fill="none" opacity="0.8"/>
      <!-- Orbiting Electron with Trail -->
      <circle cx="850" cy="140" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 6px #61DAFB)"/>
      <circle cx="650" cy="140" r="2.8" fill="#61DAFB" opacity="0.7"/>
    </g>

    <!-- React Electron Orbit Beta (60 deg) -->
    <g class="react-orbit-60">
      <ellipse cx="750" cy="140" rx="100" ry="38" stroke="url(#react-indigo-grad)" stroke-width="1.8" fill="none" opacity="0.75"/>
      <!-- Orbiting Electron -->
      <circle cx="850" cy="140" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 6px #818CF8)"/>
      <circle cx="650" cy="140" r="2.8" fill="#818CF8" opacity="0.7"/>
    </g>

    <!-- React Electron Orbit Gamma (120 deg) -->
    <g class="react-orbit-120">
      <ellipse cx="750" cy="140" rx="100" ry="38" stroke="url(#react-teal-grad)" stroke-width="1.8" fill="none" opacity="0.8"/>
      <!-- Orbiting Electron -->
      <circle cx="850" cy="140" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 6px #22D3EE)"/>
      <circle cx="650" cy="140" r="2.8" fill="#22D3EE" opacity="0.7"/>
    </g>

    <!-- Pulsating React Nucleus Core -->
    <g class="react-nucleus">
      <circle cx="750" cy="140" r="11" fill="#61DAFB"/>
      <circle cx="750" cy="140" r="5" fill="#FFFFFF"/>
      <circle cx="750" cy="140" r="16" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" fill="none"/>
    </g>

    <!-- Telemetry Label -->
    <text class="font-mono" x="750" y="246" font-size="10" font-weight="600" fill="#61DAFB" opacity="0.55" text-anchor="middle" letter-spacing="1.5">REACT // QUANTUM CORE</text>
  </g>

  <!-- ================= TWINKLING STAR POINTS ================= -->
  <g class="star-a" transform="translate(560, 50)">
    <path d="M0 -5 L0 5 M-5 0 L5 0" stroke="#818CF8" stroke-width="1"/>
    <circle cx="0" cy="0" r="1" fill="#FFFFFF"/>
  </g>
  <g class="star-b" transform="translate(420, 58)">
    <circle cx="0" cy="0" r="1.5" fill="#67E8F9"/>
  </g>

  <!-- ================= HERO CONTENT (Left Aligned) ================= -->
  
  <!-- Premium Diamond Sparkle & Minimal Monospace Tag -->
  <g transform="translate(60, 46)">
    <g class="sparkle-icon">
      <path d="M 8 0 L 10.2 5.8 L 16 8 L 10.2 10.2 L 8 16 L 5.8 10.2 L 0 8 L 5.8 5.8 Z" fill="url(#sparkle-grad)"/>
    </g>
    <text class="font-mono" x="26" y="12" font-size="12" font-weight="600" fill="#C7D2FE" letter-spacing="1">DEV // ACTIVE</text>
    <text class="font-mono" x="134" y="12" font-size="12" font-weight="400" fill="#475569">01</text>
  </g>

  <!-- Main Name: High-impact Platinum Chrome Specular Gradient -->
  <g transform="translate(60, 122)" filter="url(#text-backlight)">
    <text class="hero-title" x="0" y="0" fill="url(#name-specular)">
      Akshat Joshi
    </text>
  </g>

  <!-- Catchy, Premium UI Subheading -->
  <g transform="translate(60, 158)">
    <text class="hero-sub" x="0" y="0" fill="#CBD5E1">
      Crafting interfaces that feel alive
    </text>
  </g>

  <!-- ================= TECH CAPSULES DOCK ================= -->
  <g transform="translate(60, 198)">
    <!-- Pill 1: React with Spinning Micro-Atom -->
    <g>
      <rect width="92" height="30" rx="15" fill="rgba(97, 218, 251, 0.08)" stroke="rgba(97, 218, 251, 0.3)" stroke-width="1.2"/>
      <!-- Animated Spinning Micro React Icon -->
      <g class="mini-react-atom">
        <ellipse cx="15" cy="15" rx="6.5" ry="2.4" stroke="#61DAFB" stroke-width="0.9" fill="none"/>
        <ellipse cx="15" cy="15" rx="6.5" ry="2.4" stroke="#61DAFB" stroke-width="0.9" fill="none" transform="rotate(60 15 15)"/>
        <ellipse cx="15" cy="15" rx="6.5" ry="2.4" stroke="#61DAFB" stroke-width="0.9" fill="none" transform="rotate(120 15 15)"/>
        <circle cx="15" cy="15" r="1.4" fill="#FFFFFF"/>
      </g>
      <text class="tag-text" x="29" y="19" fill="#E0F2FE" font-weight="600">React</text>
    </g>

    <!-- Pill 2: TypeScript -->
    <g transform="translate(102, 0)">
      <rect width="112" height="30" rx="15" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
      <circle cx="15" cy="15" r="3" fill="#3178C6"/>
      <text class="tag-text" x="26" y="19" fill="#F1F5F9">TypeScript</text>
    </g>

    <!-- Pill 3: JavaScript -->
    <g transform="translate(224, 0)">
      <rect width="112" height="30" rx="15" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
      <circle cx="15" cy="15" r="3" fill="#F7DF1E"/>
      <text class="tag-text" x="26" y="19" fill="#F1F5F9">JavaScript</text>
    </g>

    <!-- Pill 4: HTML & CSS -->
    <g transform="translate(346, 0)">
      <rect width="116" height="30" rx="15" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
      <circle cx="15" cy="15" r="3" fill="#E34F26"/>
      <text class="tag-text" x="26" y="19" fill="#F1F5F9">HTML &amp; CSS</text>
    </g>

    <!-- Pill 5: Browser Extensions -->
    <g transform="translate(472, 0)">
      <rect width="154" height="30" rx="15" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
      <circle cx="15" cy="15" r="3" fill="#A855F7"/>
      <text class="tag-text" x="26" y="19" fill="#F1F5F9">Browser Extensions</text>
    </g>
  </g>

  <!-- Top-right Telemetry -->
  <g transform="translate(896, 24)" opacity="0.35">
    <text class="font-mono" x="0" y="0" font-size="10.5" fill="#94A3B8" text-anchor="end">SYS_01 // 920x280</text>
  </g>
</svg>
